[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hand2-microwave-rl"
version = "0.1.0"
description = "MuJoCo reinforcement learning environment for Hand2 microwave loading"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29",
  "mujoco>=3.1",
  "numpy>=1.24",
]

[project.optional-dependencies]
train = ["stable-baselines3>=2.3", "tensorboard>=2.14"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
"hand2_microwave" = ["assets/*.xml"]
